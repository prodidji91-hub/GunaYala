[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pictures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
